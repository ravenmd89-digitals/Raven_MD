<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAVEN MD BOT • Pairing</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 20% 10%,#102a63 0,transparent 42%),radial-gradient(ellipse at 90% 90%,#58151f 0,transparent 38%),#050713;color:#f8fafc;font-family:system-ui,Arial;overflow:hidden}.card{width:min(92%,470px);padding:30px;border:1px solid #2563eb88;border-radius:30px;background:#080d1ce8;text-align:center;box-shadow:0 0 28px #2563eb55,0 0 52px #dc262633;animation:rise .8s ease both}.logo{width:110px;height:110px;object-fit:cover;border-radius:28px;border:1px solid #60a5fa;box-shadow:0 0 25px #2563eb99;animation:pulse 3s infinite}h1{letter-spacing:3px;font-size:27px;margin:18px 0 4px;text-shadow:0 0 18px #3b82f6}p{color:#aab7d2}.tag{font-size:12px;letter-spacing:3px;color:#fb7185}input,button{width:100%;padding:15px 18px;margin-top:12px;border-radius:999px;color:#fff;background:#0d1730;border:1px solid #3b82f6;font-size:15px}button{cursor:pointer;background:linear-gradient(100deg,#1d4ed8,#b91c1c);font-weight:800;border:0;box-shadow:0 0 22px #2563eb55;transition:.2s}button:hover{transform:translateY(-2px);filter:brightness(1.15)}#result{white-space:pre-wrap;color:#93c5fd;overflow-wrap:anywhere}.foot{font-size:12px;margin-top:22px;color:#7c8ba8}@keyframes pulse{50%{box-shadow:0 0 38px #dc262677,0 0 55px #2563eb77}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}</style></head><body><main class="card"><img class="logo" src="https://i.imgur.com/QC7uZX8.jpeg" alt="RAVEN logo"><h1>RAVEN MD BOT</h1><div class="tag">SECURE PAIRING PORTAL</div><p>Blue × Red Glow • WhatsApp Connection</p><form id="form"><input id="number" inputmode="numeric" autocomplete="tel" placeholder="WhatsApp number e.g. 923001234567" required><button id="submit" type="submit">GENERATE PAIRING CODE</button></form><p id="result">Enter your number with country code.</p><div class="foot">OWNER: RANA FURQAN · DEVELOPER: JOKER RKS</div></main><script>const form=document.querySelector('#form'),result=document.querySelector('#result'),button=document.querySelector('#submit');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='CONNECTING...';result.textContent='Requesting code from WhatsApp...';try{const r=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:document.querySelector('#number').value})});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||'Pairing failed');result.textContent='YOUR PAIRING CODE\n\n'+data.code+'\n\nWhatsApp → Linked devices → Link a device';}catch(err){result.textContent='PAIRING ERROR\n'+err.message;}finally{button.disabled=false;button.textContent='GENERATE PAIRING CODE';}});</script></body></html>
